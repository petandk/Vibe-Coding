<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>miniSudokuku</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1 class="logo">mini<em>sudokuku</em></h1>
      <div class="clock">
        <span id="timer" class="timer" aria-live="off">0:00</span>
        <button id="pauseBtn" class="icon-btn" title="Pause (P)" aria-label="Pause">
          <svg viewBox="0 0 24 24" class="i-pause"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
          <svg viewBox="0 0 24 24" class="i-play"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
        </button>
      </div>
    </header>

    <nav id="difficulty" class="difficulty" aria-label="Difficulty">
      <button data-diff="easy">Easy</button>
      <button data-diff="medium">Medium</button>
      <button data-diff="hard">Hard</button>
      <button data-diff="expert">Expert</button>
    </nav>

    <section class="board-wrap">
      <div id="board" class="board" role="grid" aria-label="Mini sudoku board"></div>
      <div id="pauseOverlay" class="pause-overlay" hidden>
        <p>Paused</p>
        <button id="resumeBtn" class="btn primary">Resume</button>
      </div>
    </section>

    <div id="pad" class="pad" aria-label="Number pad"></div>

    <div class="actions">
      <button id="undoBtn" class="tool" title="Undo (Ctrl+Z)">
        <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        <span>Undo</span>
      </button>
      <button id="eraseBtn" class="tool" title="Erase (Backspace)">
        <svg viewBox="0 0 24 24"><path d="M20 20H9L4 15a2 2 0 0 1 0-2.8L13.2 3a2 2 0 0 1 2.8 0L21 8a2 2 0 0 1 0 2.8L12 20"/><path d="m8 9 7 7"/></svg>
        <span>Erase</span>
      </button>
      <button id="notesBtn" class="tool" title="Notes (N)" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span>Notes</span>
      </button>
      <button id="hintBtn" class="tool" title="Hint (+15s)">
        <svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>
        <span>Hint</span>
      </button>
    </div>

    <div class="footer-row">
      <button id="newBtn" class="btn primary">New game</button>
      <label class="switch">
        <input type="checkbox" id="conflictsToggle">
        <span class="track"><span class="thumb"></span></span>
        Show conflicts
      </label>
    </div>

    <section class="stats">
      <h2>Your records</h2>
      <table>
        <thead><tr><th>Level</th><th>Solved</th><th>Best</th><th>Average</th></tr></thead>
        <tbody id="statsBody"></tbody>
      </table>
      <p class="keys">Keys: <kbd>1</kbd>–<kbd>6</kbd> place · <kbd>Shift</kbd>+digit note · arrows move · <kbd>N</kbd> notes · <kbd>P</kbd> pause · <kbd>Ctrl</kbd>+<kbd>Z</kbd> undo</p>
    </section>
  </main>

  <div id="winModal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="winTitle">
      <p class="badge" id="winBadge" hidden>New best!</p>
      <h2 id="winTitle">Solved</h2>
      <p class="win-time" id="winTime">0:00.0</p>
      <p class="win-meta" id="winMeta"></p>
      <div class="modal-actions">
        <button id="againBtn" class="btn primary">Next puzzle</button>
        <button id="closeBtn" class="btn ghost">Close</button>
      </div>
    </div>
  </div>

  <script src="generator.js"></script>
  <script src="game.js"></script>
</body>
</html>
